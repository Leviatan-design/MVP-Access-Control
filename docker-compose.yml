services:
  postgres:
    image: postgres:16-alpine
    container_name: access-pass-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: access_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: access-pass-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/access_pass
      JWT_SECRET_KEY: change-this-development-secret-before-production
      SUPER_ADMIN_PASSWORD: ChangeThis-FlowLogic-2026!
      DATA_DIR: /app/data
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  app_data:
